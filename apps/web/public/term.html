<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent Button — Web TUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0c0d10; }
    #bar {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 18px; color: #9aa3b2;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      border-bottom: 1px solid #1c1f26;
    }
    #bar b { color: #e8ecf3; font-weight: 600; letter-spacing: 0.04em; }
    #bar a { color: #6ab0ff; text-decoration: none; }
    #status { margin-left: auto; }
    #wrap { padding: 14px 18px; height: calc(100% - 70px); box-sizing: border-box; }
    #terminal { height: 100%; }
  </style>
</head>
<body>
  <div id="bar">
    <b>AGENT BUTTON</b>
    <span>web TUI — keys go straight to the terminal app</span>
    <a href="/">dashboard</a>
    <span id="status">connecting…</span>
  </div>
  <div id="wrap"><div id="terminal"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script>
    const term = new Terminal({
      fontSize: 14,
      fontFamily: "SF Mono, Menlo, Monaco, monospace",
      theme: { background: "#0c0d10", foreground: "#d7dde7", cursor: "#6ab0ff" },
      cursorBlink: false,
      scrollback: 0,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("terminal"));
    fit.fit();

    const cols = term.cols, rows = term.rows;
    const status = document.getElementById("status");
    const ws = new WebSocket(`ws://${location.host}/ws/tui?cols=${cols}&rows=${rows}`);
    ws.onopen = () => { status.textContent = `connected ${cols}x${rows}`; term.focus(); };
    ws.onmessage = (e) => term.write(e.data);
    ws.onclose = () => { status.textContent = "disconnected — reload to reconnect"; };
    term.onData((data) => { if (ws.readyState === 1) ws.send(data); });
  </script>
</body>
</html>
